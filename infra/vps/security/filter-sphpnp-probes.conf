# fail2ban filter: scanners probing for secrets and admin panels
#   -> /etc/fail2ban/filter.d/sphpnp-probes.conf
#
# The stock nginx-botsearch filter misses the paths actually seen in this server's log
# (/wwwroot.bak, /www.bak, /.env.staging, /staging/.env): one client sent 305 such
# requests in a day without ever being banned. A real visitor never asks for these.

[Definition]

failregex = ^<HOST> \- \S* \[\] "(GET|POST|HEAD|PUT) [^"]*(?:/\.env|/\.git|/\.aws|/\.ssh|/\.svn|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|/\.DS_Store|\.bak|\.sql|\.tar\.gz|\.zip|/config\.(?:json|php|yml)|/backup)[^"]*" (?:40[0-9]|444) .*$

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
