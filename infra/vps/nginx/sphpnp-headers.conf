# Security headers for www.sphpnp.com, copied from vercel.json. Installed as
# /etc/nginx/snippets/sphpnp-headers.conf and included in the server block and in
# every location that sets its own add_header (which would otherwise drop these).
# connect-src also allows api.sphpnp.com, the self-hosted Supabase API. script-src allows
# exactly the pinned Yandex Webmaster verification template that Google Tag Manager loads.
# Declare the encoding in the HTTP header, not only in the document's meta tag. Tools
# that trust the header over the body (feed readers, scrapers, link-preview crawlers)
# otherwise mis-decode UTF-8: a rupee sign comes out as "â¹" in generated snippets.
charset utf-8;
# text/html is always included; listing it again logged "duplicate MIME type" on every reload.
charset_types text/plain text/xml text/css application/javascript application/xml application/json;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), bluetooth=(), usb=(), serial=(), display-capture=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.clarity.ms https://cdn.jsdelivr.net/gh/yandex/webmaster-gtm-template@467fdc0c3ab3124a40ddf229fc8cd20392c71938/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://api.sphpnp.com wss://api.sphpnp.com https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://wa.me https://query1.finance.yahoo.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://*.youtube.com; object-src 'none'; base-uri 'self';" always;
# There is deliberately no Content-Security-Policy-Report-Only header. The one that used
# to sit here was a leftover of the Vercel setup: it carried no report-uri or report-to,
# so browsers could neither enforce nor report it, and it was narrower than the enforced
# policy above - every page load logged two console warnings about a script the enforced
# policy allows. If a trial policy is ever wanted again, it needs a report endpoint.
