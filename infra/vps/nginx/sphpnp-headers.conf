# Security headers for www.sphpnp.com, copied from vercel.json. Installed as
# /etc/nginx/snippets/sphpnp-headers.conf and included in the server block and in
# every location that sets its own add_header (which would otherwise drop these).
# connect-src also allows api.sphpnp.com, the self-hosted Supabase API.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), bluetooth=(), usb=(), serial=(), ambient-light-sensor=(), battery=(), display-capture=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://api.sphpnp.com wss://api.sphpnp.com https://*.supabase.co https://*.supabase.in wss://*.supabase.co https://wa.me https://query1.finance.yahoo.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com https://*.youtube.com; object-src 'none'; base-uri 'self';" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.sphpnp.com https://*.supabase.co https://www.google-analytics.com https://*.clarity.ms https://*.google-analytics.com https://stats.g.doubleclick.net; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
