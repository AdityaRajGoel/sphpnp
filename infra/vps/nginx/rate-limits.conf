# Rate limits (http context) -> /etc/nginx/conf.d/sphpnp-rate-limits.conf
# Zones only; the locations that use them live in sphpnp.conf (api),
# sphpnp-com.conf (analytics and error ingest) and admin-common.conf (admin).
#
# Sized from real traffic (nginx access log, 15 Sep 2026), not guesses:
#  - one stock page load fires 21-40 API requests within a second (947 such seconds)
#  - Indian mobile carriers put many users behind one IP (CGNAT), so a per-IP limit
#    must allow several page loads at once
#  - the prerender runs ON this server and calls api.sphpnp.com at up to ~60 req/s
# So limits only stop floods and scripts, and the server itself is never limited.

# Changing a zone's key or size needs `systemctl restart nginx`: a reload fails
# ("limit_req ... uses the key ... while previously it used ...") and nginx keeps
# running the OLD config even though `nginx -t` passes. Check error.log after reloads.

# Requests from the VPS itself (prerender, cron jobs, health checks) are exempt:
# an empty key is not counted by limit_req.
geo $sphpnp_limit_exempt {
    default                     0;
    127.0.0.1                   1;
    ::1                         1;
    213.136.66.97               1;
    2a02:c207:2358:1341::1      1;
}
map $sphpnp_limit_exempt $sphpnp_limit_key {
    0       $binary_remote_addr;
    1       "";
}

limit_req_zone $sphpnp_limit_key zone=sphpnp_api:20m     rate=50r/s;
limit_req_zone $sphpnp_limit_key zone=sphpnp_collect:10m rate=10r/s;
# Supabase Studio is a Next.js app: one page load pulls ~80 chunks at once, which was
# hitting the old 20 r/s limit and failing to load.
limit_req_zone $sphpnp_limit_key zone=sphpnp_admin:10m   rate=40r/s;
limit_req_status 429;
limit_req_log_level warn;

# Browser error reports: time, client, and the JSON body the page sent.
log_format sphpnp_client_error escape=json '{"time":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","report":"$request_body"}';

# Local sink for /api/client-error (sphpnp-com.conf): answers 204 so nginx reads and
# logs the request body without any application behind it.
server {
    listen 127.0.0.1:8099;
    access_log off;
    location / { return 204; }
}

# WebSocket upgrade header for proxied tools (admin.conf, admin-proxy.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
