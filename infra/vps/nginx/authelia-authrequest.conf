# Require an Authelia session -> /etc/nginx/snippets/authelia-authrequest.conf
# Unauthenticated visitors are sent to the login portal and back afterwards.
auth_request /internal/authelia/authz;
# Who signed in, so an action taken in the panel can be logged against a name
# (tools/deploy-api passes it through as X-Remote-User).
auth_request_set $authelia_user $upstream_http_remote_user;
auth_request_set $authelia_redirect $upstream_http_location;
error_page 401 =302 $authelia_redirect;
