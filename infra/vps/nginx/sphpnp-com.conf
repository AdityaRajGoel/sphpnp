# sphpnp.com on the VPS. Install with infra/vps/nginx/install.sh, never with a plain
# copy: that script refuses to replace a live file that has `listen 443` with one that
# does not, and keeps a backup of what it replaced.
#
# This copy INCLUDES the TLS server blocks certbot added (the "managed by Certbot"
# lines). It was previously kept HTTP-only on the assumption that certbot would always
# re-add them; installing that version over the live file on 2026-09-16 left
# www.sphpnp.com with no server listening on 443, so the catch-all's
# ssl_reject_handshake answered every visitor with a refused handshake until
# `certbot install --cert-name sphpnp.com --nginx` restored the blocks. Keep them here,
# and re-sync this file from the server whenever certbot edits it.
#
# Needs the brotli modules:
#   apt install libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter brotli

# Cache policy by response type. Hashed /assets and /illustrations set their own
# year-long header in their locations; an empty value sends no header.
map $sent_http_content_type $sphpnp_cache_control {
    ~^text/html   "public, max-age=300, stale-while-revalidate=86400";
    ~^image/      "public, max-age=604800";
    ~^video/      "public, max-age=604800";
    default       "";
}

# Bare domain: permanent redirect to www, as vercel.json did.
server {
    server_name sphpnp.com;
    server_tokens off;

    location / {
        return 301 https://www.sphpnp.com$request_uri;
    }

    # http2 belongs on the listen line on nginx 1.24 (the standalone `http2 on;`
    # directive arrived in 1.25.1).
    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sphpnp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sphpnp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www.sphpnp.com: the production website (static prerendered build).
server {
    server_name www.sphpnp.com;
    server_tokens off;
    root /var/www/sphpnp/current;
    index index.html;
    include /etc/nginx/snippets/sphpnp-headers.conf;

    # trailingSlash: false in vercel.json. Not under /api/: GlitchTip's ingest path
    # ends in a slash, and a redirected POST loses its body.
    rewrite ^/((?!api/).+)/$ /$1 permanent;

    # Ticker symbols are uppercase (/stock/RELIANCE) and the paths are case-sensitive, so
    # a hand-typed or mis-copied /stock/reliance used to hit the 404 page and lose the
    # link. nginx has no uppercase function, so jobs/deploy-site.sh writes the
    # lowercase -> canonical pairs of the release it just published into
    # conf.d/sphpnp-stock-redirects.conf as a map, and this sends them on in one hop.
    if ($sphpnp_stock_canonical != "") {
        return 301 https://www.sphpnp.com$sphpnp_stock_canonical;
    }

    # Clean URLs, the IPO shell for new slugs, SPA-only routes, real 404s.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ ^/ipo/[^/]+$ {
        try_files $uri $uri.html /ipo-shell.html;
    }
    # Browser error reports (src/lib/client-errors.ts). nginx only fills
    # $request_body for proxied requests, so the POST is proxied to a local sink that
    # answers 204, and the body is written to client-errors.log (log_format in
    # rate-limits.conf). The daily error digest (jobs/logs-archive.sh) reads it.
    location = /api/client-error {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        client_body_buffer_size 8k;
        limit_req zone=sphpnp_collect burst=20 nodelay;
        access_log /var/log/nginx/client-errors.log sphpnp_client_error;
        proxy_pass http://127.0.0.1:8099/;
    }

    # The four app-only routes. They are served the homepage shell, whose meta robots
    # tag says "index, follow" - so the header below is the only thing that can keep
    # them out of an index if a stray backlink points at one. robots.txt already
    # disallows them, which stops the crawl; this stops the URL being listed anyway.
    location = /auth { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }
    location = /admin { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }
    location = /reset-password { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }
    location = /banner-manager { add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }
    error_page 404 /404.html;

    location /assets/ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /illustrations/ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(xml|txt)$ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Ubuntu's mime.types has no entry for .webmanifest, so it went out as
    # application/octet-stream - the wrong type, and one gzip_types skips.
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    add_header Cache-Control $sphpnp_cache_control;

    # deploy-site.sh writes .br and .gz next to every text file; serve those, and
    # compress on the fly only for anything it missed.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # http2 belongs on the listen line on nginx 1.24 (the standalone `http2 on;`
    # directive arrived in 1.25.1).
    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sphpnp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sphpnp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    # Straight to the canonical host: http://sphpnp.com used to take two hops
    # (-> https://sphpnp.com -> https://www.sphpnp.com).
    if ($host = sphpnp.com) {
        return 301 https://www.sphpnp.com$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sphpnp.com;
    return 404; # managed by Certbot


}
server {
    if ($host = www.sphpnp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.sphpnp.com;
    return 404; # managed by Certbot


}