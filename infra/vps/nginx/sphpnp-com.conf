# sphpnp.com on the VPS. Installed as /etc/nginx/sites-available/sphpnp-com.conf.
# Written as plain HTTP; certbot --nginx adds the 443 listeners and HTTP->HTTPS
# redirects once each name resolves to this server. Needs the brotli modules:
#   apt install libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter brotli

# Cache policy by response type. Hashed /assets and /illustrations set their own
# year-long header in their locations; an empty value sends no header.
map $sent_http_content_type $sphpnp_cache_control {
    ~^text/html   "public, max-age=300, stale-while-revalidate=86400";
    ~^image/      "public, max-age=604800";
    ~^video/      "public, max-age=604800";
    default       "";
}

# Bare domain: permanent redirect to www, as vercel.json did.
server {
    listen 80;
    listen [::]:80;
    server_name sphpnp.com;
    server_tokens off;

    location / {
        return 301 https://www.sphpnp.com$request_uri;
    }
}

# www.sphpnp.com: the production website (static prerendered build).
server {
    listen 80;
    listen [::]:80;
    server_name www.sphpnp.com;
    server_tokens off;
    root /var/www/sphpnp/current;
    index index.html;
    include /etc/nginx/snippets/sphpnp-headers.conf;

    # trailingSlash: false in vercel.json. Not under /api/: GlitchTip's ingest path
    # ends in a slash, and a redirected POST loses its body.
    rewrite ^/((?!api/).+)/$ /$1 permanent;

    # Clean URLs, the IPO shell for new slugs, SPA-only routes, real 404s.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ ^/ipo/[^/]+$ {
        try_files $uri $uri.html /ipo-shell.html;
    }
    # Browser error reports (src/lib/client-errors.ts). nginx only fills
    # $request_body for proxied requests, so the POST is proxied to a local sink that
    # answers 204, and the body is written to client-errors.log (log_format in
    # rate-limits.conf). The daily error digest (jobs/logs-archive.sh) reads it.
    location = /api/client-error {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        client_body_buffer_size 8k;
        limit_req zone=sphpnp_collect burst=20 nodelay;
        access_log /var/log/nginx/client-errors.log sphpnp_client_error;
        proxy_pass http://127.0.0.1:8099/;
    }

    location = /auth { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /reset-password { try_files /index.html =404; }
    location = /banner-manager { try_files /index.html =404; }
    error_page 404 /404.html;

    location /assets/ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /illustrations/ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(xml|txt|webmanifest)$ {
        include /etc/nginx/snippets/sphpnp-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    add_header Cache-Control $sphpnp_cache_control;

    # deploy-site.sh writes .br and .gz next to every text file; serve those, and
    # compress on the fly only for anything it missed.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;
}
