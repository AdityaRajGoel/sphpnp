# Catch-all for requests that name no known hostname -> /etc/nginx/sites-available/default-server.conf
#
# Without this, the first server block in file order (admin.conf) answers anything
# addressed to the bare IP or an unknown name. Scanners do that constantly, and every
# such request ran the admin login check against a target Authelia has no session
# configuration for: ~1,700 error 500s a day plus the matching nginx error lines.
#
# Port 80/443 only. The admin tool ports (8443-8446) keep their own single server block.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    # Close without answering: nothing here is a real site.
    return 444;
}

server {
    # http2 here too: this file loads first, so its listen lines set the protocol options
    # for *:443. Without http2 every other 443 server (all of which use it) logged
    # "protocol options redefined" on each reload.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    # Refuse the TLS handshake outright, so no certificate is needed or exposed.
    ssl_reject_handshake on;
}
