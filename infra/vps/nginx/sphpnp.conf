# staging.sphpnp.com - retired as a site on 2026-09-21: it served a full copy of
# www.sphpnp.com that nothing used. It now only redirects, so old links still land.
# Its certificate stays: the "staging.sphpnp.com" cert also covers api.sphpnp.com.
server {
    listen 80;
    listen [::]:80;
    server_name staging.sphpnp.com;
    server_tokens off;
    return 301 https://www.sphpnp.com$request_uri;
}

# api.sphpnp.com - Supabase API only. The Studio dashboard is not published;
# reach it through an SSH tunnel to 127.0.0.1:8000.
server {
    listen 80;
    listen [::]:80;
    server_name api.sphpnp.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 50m;

    location ~ ^/(rest|auth|storage|functions|graphql)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        # Zone defined in nginx/rate-limits.conf; the burst covers several page loads
        # from one shared (CGNAT) IP at once.
        limit_req zone=sphpnp_api burst=300 nodelay;
    }

    # API JSON is large (fetch-ipos alone is ~1.6 MB) and was sent uncompressed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/vnd.pgrst.object+json text/plain text/csv;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types application/json application/vnd.pgrst.object+json text/plain text/csv;
    location / {
        return 404;
    }
}
