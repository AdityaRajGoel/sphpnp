# staging.sphpnp.com - the website (static prerendered build).
server {
    listen 80;
    listen [::]:80;
    server_name staging.sphpnp.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Staging must never be indexed as a duplicate of sphpnp.com.
    add_header X-Robots-Tag "noindex, nofollow" always;
    root /var/www/staging/current;
    index index.html;

    # Same rules as vercel.json: clean URLs, IPO shell for new slugs, real 404s.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ ^/ipo/[^/]+$ {
        try_files $uri $uri.html /ipo-shell.html;
    }
    location = /auth { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /reset-password { try_files /index.html =404; }
    location = /banner-manager { try_files /index.html =404; }
    error_page 404 /404.html;

    # A location with its own add_header drops the server-level ones, so repeat nosniff.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /illustrations/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}

# api.sphpnp.com - Supabase API only. The Studio dashboard is not published;
# reach it through an SSH tunnel to 127.0.0.1:8000.
server {
    listen 80;
    listen [::]:80;
    server_name api.sphpnp.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 50m;

    location ~ ^/(rest|auth|storage|functions|graphql)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        # Zone defined in nginx/rate-limits.conf; the burst covers several page loads
        # from one shared (CGNAT) IP at once.
        limit_req zone=sphpnp_api burst=300 nodelay;
    }

    # API JSON is large (fetch-ipos alone is ~1.6 MB) and was sent uncompressed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/vnd.pgrst.object+json text/plain text/csv;
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types application/json application/vnd.pgrst.object+json text/plain text/csv;
    location / {
        return 404;
    }
}
