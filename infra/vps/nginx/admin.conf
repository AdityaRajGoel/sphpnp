# admin.sphpnp.com - control panel for the ops tools (infra/vps/tools).
# Installed as /etc/nginx/sites-available/admin.conf. One hostname and certificate; the
# tools do not run under a sub-path, so each keeps its own HTTPS port. Every protected
# page requires an Authelia session (admin-common.conf): one sign-in covers all ports
# and signing out ends it everywhere.
#
#   https://admin.sphpnp.com         dashboard, traffic, browser errors, digests, status
#   https://admin.sphpnp.com/auth    Authelia login portal (sign in / sign out)
#   https://admin.sphpnp.com:8443    Gatus        (uptime, certificates, status)
#   https://admin.sphpnp.com:8444    Glances      (server and container metrics)
#   https://admin.sphpnp.com:8445    Supabase Studio (credentials added by nginx)
#   https://admin.sphpnp.com:8446    ntfy push endpoint (no login: the secret topic is the
#                                     key, the web app is disabled)
#   https://admin.sphpnp.com:8447    Dozzle       (live container logs)
#   https://admin.sphpnp.com:8448    PgHero       (slow queries, indexes, table bloat)
#   https://admin.sphpnp.com:8449    changedetection.io (watched pages)

server {
    listen 80;
    listen [::]:80;
    server_name admin.sphpnp.com;
    server_tokens off;
    location / { return 301 https://admin.sphpnp.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;

    root /var/www/admin;
    index index.html;

    # The login portal itself must be reachable without a session.
    location /auth/ {
        auth_request off;
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /auth { return 301 /auth/; }

    location / {
        try_files $uri $uri/ =404;
        # add_header here replaces the server-level set, so repeat it.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Gatus results for the dashboard, same origin.
    location /status-api/ {
        proxy_pass http://127.0.0.1:3003/api/;
        add_header Cache-Control "no-store" always;
    }

    # Daily error digests from jobs/logs-archive.sh.
    location /errors/ {
        alias /var/log/sphpnp/errors/;
        autoindex on;
        default_type text/plain;
    }
    # Daily GoAccess reports from jobs/traffic-report.sh.
    location /traffic/ {
        alias /var/log/sphpnp/traffic/;
        autoindex on;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3004;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/admin-proxy.conf;
        # After admin-proxy.conf, which clears Authorization: Studio's own gateway
        # credentials, generated on the server from /opt/supabase/.env (never in git):
        #   proxy_set_header Authorization "Basic <base64 DASHBOARD_USERNAME:DASHBOARD_PASSWORD>";
        include /etc/nginx/snippets/admin-studio-auth.conf;
    }
}

server {
    listen 8447 ssl http2;
    listen [::]:8447 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3006;
        include /etc/nginx/snippets/admin-proxy.conf;
        # Dozzle streams logs; admin-proxy.conf already allows 300 s of quiet.
        proxy_buffering off;
    }
}

server {
    listen 8448 ssl http2;
    listen [::]:8448 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3007;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8449 ssl http2;
    listen [::]:8449 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3008;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

# ntfy: phones subscribe here with the ntfy app, which cannot sign in to Authelia. The
# topic name is a long random secret and the web app is disabled.
server {
    listen 8446 ssl http2;
    listen [::]:8446 ssl http2;
    server_name admin.sphpnp.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/admin.sphpnp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.sphpnp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        limit_req zone=sphpnp_collect burst=50 nodelay;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Subscriptions are long-lived streams.
        proxy_buffering off;
        proxy_read_timeout 3h;
    }
}
