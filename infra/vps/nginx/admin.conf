# admin.sphpnp.com - control panel for the ops tools (infra/vps/tools).
# Installed as /etc/nginx/sites-available/admin.conf. The tools do not run under a
# sub-path, so each keeps its own HTTPS port on this one hostname (one certificate,
# one DNS record). Every port asks for the admin password first (basic auth,
# /etc/nginx/admin.htpasswd); fail2ban bans repeated failures. Each tool then has
# its own login as well.
#
#   https://admin.sphpnp.com        links to everything below
#   https://admin.sphpnp.com:8441   Umami        (visitor analytics)
#   https://admin.sphpnp.com:8442   GlitchTip    (errors)
#   https://admin.sphpnp.com:8443   Uptime Kuma  (uptime and alerts)
#   https://admin.sphpnp.com:8444   Beszel       (server and container metrics)
#   https://admin.sphpnp.com:8445   Supabase Studio (database; has its own password too)

server {
    listen 80;
    listen [::]:80;
    server_name admin.sphpnp.com;
    server_tokens off;
    location / { return 301 https://admin.sphpnp.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;

    root /var/www/admin;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 8441 ssl http2;
    listen [::]:8441 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8442 ssl http2;
    listen [::]:8442 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    location / {
        proxy_pass http://127.0.0.1:3004;
        include /etc/nginx/snippets/admin-proxy.conf;
    }
}

server {
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;
    server_name admin.sphpnp.com;
    include /etc/nginx/snippets/admin-common.conf;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/admin-proxy.conf;
        # After admin-proxy.conf, which clears Authorization: Studio's own gateway
        # credentials, generated on the server from /opt/supabase/.env (never in git):
        #   proxy_set_header Authorization "Basic <base64 DASHBOARD_USERNAME:DASHBOARD_PASSWORD>";
        include /etc/nginx/snippets/admin-studio-auth.conf;
    }
}
