# IPO pages merged into another row (http context, /etc/nginx/conf.d/). sync-ipos folds
# duplicate rows of one issue and deletes the duplicate's slug; a published duplicate URL
# then 301s to the surviving issue instead of the IPO not-found shell. sphpnp-com.conf
# returns on $sphpnp_ipo_moved.
#
# 15 Oct 2026: IPO Watch's status badge had been glued onto names ("HD Fire Protect
# Open"), and the 14 Oct build published those slugs before the merge.
