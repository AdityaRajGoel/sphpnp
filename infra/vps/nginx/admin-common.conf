# Shared by every admin.sphpnp.com server block -> /etc/nginx/snippets/admin-common.conf
server_tokens off;
ssl_certificate /etc/letsencrypt/live/admin.sphpnp.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/admin.sphpnp.com/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# Login: user "aditya", SHA-512 crypt hash in /etc/nginx/admin.htpasswd (root:www-data 640):
#   printf 'aditya:%s\n' "$(openssl passwd -6)" | sudo install -m 640 -o root -g www-data /dev/stdin /etc/nginx/admin.htpasswd
# fail2ban's nginx-http-auth jail bans an IP after 5 wrong passwords in 10 minutes.
auth_basic "sphpnp admin";
auth_basic_user_file /etc/nginx/admin.htpasswd;
limit_req zone=sphpnp_admin burst=30 nodelay;

add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# A tool that answers with a redirect to its own port must keep the public one.
absolute_redirect off;
