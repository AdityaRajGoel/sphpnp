# Shared by every protected admin.sphpnp.com server block -> /etc/nginx/snippets/admin-common.conf
server_tokens off;
ssl_certificate /etc/letsencrypt/live/admin.sphpnp.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/admin.sphpnp.com/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# Login: Authelia (tools/authelia). Every request is checked against the session cookie;
# signing out at https://admin.sphpnp.com/auth/logout ends it on every port at once.
include /etc/nginx/snippets/authelia-location.conf;
include /etc/nginx/snippets/authelia-authrequest.conf;
limit_req zone=sphpnp_admin burst=200 nodelay;

add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;

# This hostname fronts six third-party web UIs whose code we do not control (Studio,
# Gatus, Glances, Dozzle, PgHero, changedetection.io). Without a policy, an XSS in any
# one of them could read the Authelia session cookie and reach the others on this same
# origin. 'unsafe-inline'/'unsafe-eval' are permitted because those bundled UIs need
# them; the value here is confining script and connect targets to this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

# A tool that answers with a redirect to its own port must keep the public one.
absolute_redirect off;
