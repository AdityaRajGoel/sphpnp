# Internal Authelia check -> /etc/nginx/snippets/authelia-location.conf
# Included once in every protected admin server block (auth_request is per server).
location = /internal/authelia/authz {
    internal;
    proxy_pass http://127.0.0.1:9091/auth/api/authz/auth-request;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Sign-in is by session cookie only; never hand Authelia a remembered basic-auth header.
    proxy_set_header Authorization "";
    proxy_set_header X-Original-Method $request_method;
    # $http_host keeps the port, so a login started on :8443 returns to :8443.
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
}
