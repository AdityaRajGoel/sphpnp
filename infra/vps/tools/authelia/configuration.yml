# Authelia: login portal for admin.sphpnp.com -> /opt/sphpnp-tools/authelia/configuration.yml
# Open-source, runs on the VPS, no external accounts. nginx asks Authelia before serving
# any admin page (nginx/authelia-authrequest.conf); the portal lives at /auth.
# Secrets are files generated by tools/setup.sh and passed as *_FILE environment
# variables (docker-compose.yml), never stored here.

theme: auto

server:
  address: tcp://0.0.0.0:9091/auth
  endpoints:
    authz:
      auth-request:
        implementation: AuthRequest
        # Session cookie only. Browsers that remember the old basic-auth password keep
        # sending it, and checking an argon2 hash on every request ran Authelia out of
        # memory (OOM restarts, 502s on every admin page).
        authn_strategies:
          - name: CookieSession

log:
  level: info

authentication_backend:
  # No email is configured, so self-service password reset is off; change the password
  # by re-running tools/setup.sh with a new one.
  password_reset:
    disable: true
  file:
    path: /config/users.yml
    watch: true
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: admin.sphpnp.com
      policy: one_factor

session:
  cookies:
    - domain: admin.sphpnp.com
      authelia_url: https://admin.sphpnp.com/auth
      default_redirection_url: https://admin.sphpnp.com/
      name: sphpnp_admin_session
      same_site: lax
      inactivity: 1h
      expiration: 12h
      remember_me: 7d

# Locks an account out after 5 wrong passwords within 10 minutes, for an hour.
regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 1h

storage:
  local:
    path: /data/db.sqlite3

# Nothing is emailed (password reset is off); required by Authelia regardless.
notifier:
  filesystem:
    filename: /data/notification.txt
