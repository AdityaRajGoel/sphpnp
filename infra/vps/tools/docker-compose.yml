# Ops tools for sphpnp.com -> /opt/sphpnp-tools
# Free, open-source, and no accounts or logins of their own: everything is behind the
# single admin password on admin.sphpnp.com (nginx/admin.conf).
#   Gatus    uptime checks, certificate expiry, status page   (config: gatus.yaml)
#   ntfy     push alerts to a phone, no account (secret topic in .env)
#   Glances  live CPU, memory, disk, network and container dashboard
# Traffic reports (GoAccess) and browser errors (nginx log) are static pages made by
# jobs/admin-reports.sh, not services.
name: sphpnp-tools

services:
  gatus:
    image: twinproduction/gatus:stable
    restart: unless-stopped
    # Host network: checks can reach the local gateway and ntfy on 127.0.0.1, and the
    # UI listens only on 127.0.0.1:3003 (web.address in gatus.yaml).
    network_mode: host
    environment:
      GATUS_CONFIG_PATH: /config/gatus.yaml
      NTFY_TOPIC: ${NTFY_TOPIC}
    volumes:
      - ./gatus.yaml:/config/gatus.yaml:ro
      - ./data/gatus:/data
    mem_limit: 96m

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://admin.sphpnp.com:8446
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      # No accounts: a long random topic name (NTFY_TOPIC in .env) is the only key.
      # The web app is off; phones subscribe with the ntfy app.
      NTFY_WEB_ROOT: disable
      NTFY_ENABLE_LOGIN: "false"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: "0"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:3005:80"
    mem_limit: 64m

  glances:
    image: nicolargo/glances:latest-full
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      # Web UI on 127.0.0.1:3004 only; nginx serves it behind the admin password.
      GLANCES_OPT: "-w --bind 127.0.0.1 --port 3004 --disable-check-update"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    mem_limit: 256m
