# Ops tools for sphpnp.com -> /opt/sphpnp-tools
# Free, open-source, and no accounts or logins of their own: everything is behind the
# single admin password on admin.sphpnp.com (nginx/admin.conf).
#   Gatus    uptime checks, certificate expiry, status page   (config: gatus.yaml)
#   ntfy     push alerts to a phone, no account (secret topic in .env)
#   Glances  live CPU, memory, disk, network and container dashboard
# Traffic reports (GoAccess) and browser errors (nginx log) are static pages made by
# jobs/admin-reports.sh, not services.
name: sphpnp-tools

# PgHero needs to reach the database container, which lives in the Supabase project's
# own network; everything else stays on this project's default network.
networks:
  default:
  supabase:
    external: true
    name: supabase_default

services:
  # Login portal for admin.sphpnp.com: one session cookie for every admin port, a real
  # logout, and lockout after repeated wrong passwords (authelia/configuration.yml).
  authelia:
    image: authelia/authelia:4.39.27
    restart: unless-stopped
    # Stays root: the image's entrypoint chowns /config and su-execs, which needs
    # CHOWN/SETUID/SETGID. Tried read_only + cap_drop + user 1001 (2026-09-16); it failed
    # with "su-exec: setgroups(0): Operation not permitted" and the panel went 502.
    security_opt: ["no-new-privileges:true"]
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      TZ: Asia/Kolkata
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users.yml:/config/users.yml:ro
      - ./authelia/secrets:/secrets:ro
      - ./data/authelia:/data
    ports:
      - "127.0.0.1:9091:9091"
    # Each argon2 password check uses ~64 MB; 128m was OOM-killed during sign-in.
    mem_limit: 384m

  gatus:
    image: twinproduction/gatus:v5.36.0
    restart: unless-stopped
    # Runs as the data directory's owner (deploy) instead of root: with every capability
    # dropped, a root process can no longer bypass file permissions (no DAC_OVERRIDE),
    # which is what broke the first attempt at this.
    user: "1001:1001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Host network: checks can reach the local gateway and ntfy on 127.0.0.1, and the
    # UI listens only on 127.0.0.1:3003 (web.address in gatus.yaml).
    network_mode: host
    environment:
      GATUS_CONFIG_PATH: /config/gatus.yaml
      NTFY_TOPIC: ${NTFY_TOPIC}
    volumes:
      - ./gatus.yaml:/config/gatus.yaml:ro
      - ./data/gatus:/data
    mem_limit: 96m

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: serve
    environment:
      NTFY_BASE_URL: https://admin.sphpnp.com:8446
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      # No accounts: a long random topic name (NTFY_TOPIC in .env) is the only key.
      # The web app is off; phones subscribe with the ntfy app.
      NTFY_WEB_ROOT: disable
      NTFY_ENABLE_LOGIN: "false"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: "0"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:3005:80"
    mem_limit: 64m

  # Live container logs in the browser, so routine checks need no SSH. Read-only docker
  # socket; it can read logs and nothing else.
  dozzle:
    image: amir20/dozzle:v11.1.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ADDR: ":8080"
      # Sign-in is Authelia's, in front (nginx/admin.conf).
      DOZZLE_AUTH_PROVIDER: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3006:8080"
    mem_limit: 128m

  # Slow queries, missing indexes and table bloat for the Supabase database.
  # pg_stat_statements is already preloaded by the Supabase image.
  pghero:
    # No usable version tag is published, so this is pinned by digest (PgHero 4.0.1).
    image: ankane/pghero@sha256:5c84930b3b8050da57bf4f5243454d323097599cf44bb57a5e7acec6433155e7
    restart: unless-stopped
    read_only: true
    # Rails writes its pid and cache under /tmp and /app/tmp.
    tmpfs: [/tmp, /app/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: ${PGHERO_DATABASE_URL}
      RAILS_LOG_TO_STDOUT: "true"
      # No PgHero login: Authelia guards the port.
      PGHERO_TIME_ZONE: Asia/Kolkata
    networks:
      - default
      - supabase
    ports:
      - "127.0.0.1:3007:8080"
    mem_limit: 256m

  # Watches pages that have no API (exchange circulars, regulator notices) and records
  # what changed. Feeds new data sources; alerts can go to the ntfy topic.
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.6
    restart: unless-stopped
    # Stays root and writable: it creates per-watch directories under /datastore at
    # startup, which failed as a non-root user with capabilities dropped.
    security_opt: ["no-new-privileges:true"]
    environment:
      BASE_URL: https://admin.sphpnp.com:8449
      USE_X_SETTINGS: "1"
    volumes:
      - ./data/changedetection:/datastore
    ports:
      - "127.0.0.1:3008:5000"
    mem_limit: 512m

  glances:
    image: nicolargo/glances:4.5.6-full
    restart: unless-stopped
    # Reads host processes and the docker socket, so it keeps its capabilities and a
    # writable filesystem; it still cannot gain new privileges.
    security_opt: ["no-new-privileges:true"]
    pid: host
    network_mode: host
    environment:
      # Web UI on 127.0.0.1:3004 only; nginx serves it behind the admin password.
      GLANCES_OPT: "-w --bind 127.0.0.1 --port 3004 --disable-check-update"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    mem_limit: 256m
