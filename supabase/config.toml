project_id = "zbkjbbujsdlpujotgltm"

[functions.telegram-webhook]
verify_jwt = false

# Sync jobs are called by GitHub Actions with the anon key + x-sync-secret; they
# guard themselves via SYNC_SECRET, so JWT verification must stay OFF (otherwise
# the gateway rejects the request before the function runs).
[functions.sync-market-feed]
verify_jwt = false

[functions.sync-bhavcopy]
verify_jwt = false

# sync-fundamentals and sync-unlisted-quotes were both missing from this list
# while running in production with verification off, so the setting existed only
# out-of-band. The first `functions deploy` from a clean checkout would have
# applied the default (true) and the gateway would have started rejecting each
# workflow's calls before the function ran - turning a fixable outage into a
# harder one, since a gateway 401 replaces the summary JSON the workflow reads.
#
# Both self-guard exactly as the two above do: the workflow sends x-sync-secret,
# the function compares it against SYNC_SECRET and 401s on mismatch, and a unset
# SYNC_SECRET locks the endpoint rather than leaving it open. That guard, not
# verify_jwt, is what protects these service-role writers.
[functions.sync-fundamentals]
verify_jwt = false

[functions.sync-stock-statements]
verify_jwt = false

[functions.sync-ipo-details]
verify_jwt = false

[functions.sync-google-finance]
verify_jwt = false

[functions.sync-ipo-pipeline]
verify_jwt = false

[functions.sync-sebi-actions]
verify_jwt = false

[functions.build-screener-fundamentals]
verify_jwt = false

# Same self-guard as sync-fundamentals above: SYNC_SECRET protects the
# service-role writes, so verify_jwt must stay declared and off here from the
# first deploy rather than silently defaulting to true.
[functions.sync-fundamentals-yahoo]
verify_jwt = false

[functions.sync-unlisted-quotes]
verify_jwt = false

# Same self-guard as the other sync-* functions above: SYNC_SECRET protects
# the service-role writes, so verify_jwt must stay declared and off here from
# the first deploy rather than silently defaulting to true and turning a
# fixable gateway rejection into a harder-to-diagnose one.
[functions.sync-macro]
verify_jwt = false

# IPO catalogue and GMP snapshots are written by the scheduled Action. It uses
# the same SYNC_SECRET guard as the other service-role writer functions.
[functions.sync-ipos]
verify_jwt = false

[functions.sync-announcements]
verify_jwt = false

[functions.sync-nse-disclosures]
verify_jwt = false

[functions.sync-screener-in]
verify_jwt = false

[functions.sync-bse-announcements]
verify_jwt = false

[functions.sync-tickertape]
verify_jwt = false

[functions.sync-market-data]
verify_jwt = false

[functions.sync-global-markets]
verify_jwt = false

# Same self-guard as every other sync-* function above: SYNC_SECRET protects the
# service-role writes, so verify_jwt must be declared off here from the FIRST
# deploy. Left undeclared it defaults to true and the gateway rejects the
# workflow's call before the function runs, which replaces the summary JSON the
# workflow parses with a gateway 401 - the harder-to-diagnose failure this file's
# earlier comments were written about.
[functions.sync-price-analytics]
verify_jwt = false

[functions.sync-fundamental-scores]
verify_jwt = false

# Receives Kronos forecast rows from the GitHub Actions job, which carries only
# the anon key and the shared secret - the service-role key stays here, in the
# function. Same guard, same reason.
[functions.ingest-forecasts]
verify_jwt = false
