# Catches broken builds BEFORE Vercel deploys them.
# Hard gates: typecheck, tests, production build.
# Lint reports but does not block (101 pre-existing issues to burn down).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build (vite only, no prerender)
        run: npx vite build
      - name: Lint
        run: npx eslint . --max-warnings=0

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - run: npx playwright install chromium --with-deps
      - name: E2E smoke tests
        run: npx playwright test

  docker:
    runs-on: ubuntu-latest
    # Runs on pushes too. It used to be pull-request only, but changes land on
    # main directly, so the self-host image went unbuilt by CI - "skipped" on
    # every commit. A build alone also proves little; the container is started
    # and asked for real pages.
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sphpnp-web .
      - name: Serve and smoke-test the image
        run: |
          docker run -d --name web -p 8090:80 sphpnp-web
          for i in $(seq 1 30); do curl -fs http://localhost:8090/ >/dev/null && break; sleep 1; done
          check() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" "http://localhost:8090$1")
            echo "$1 -> $code"
            [ "$code" = "200" ] || { docker logs web; exit 1; }
          }
          check /
          # A deep link only works if nginx's SPA fallback serves index.html.
          check /ipo
          check /stock/RELIANCE
          grep -q '<div id="root">' /tmp/body || { echo "deep link did not get the app shell"; exit 1; }
          # Security headers must survive the move off Vercel.
          curl -sI http://localhost:8090/ | grep -qi '^x-content-type-options: nosniff' || { echo "missing security headers"; exit 1; }
          # The image's own HEALTHCHECK must pass, or orchestrators restart it
          # forever. Its first probe runs 30s after start (--interval=30s).
          for i in $(seq 1 70); do
            status=$(docker inspect --format '{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          echo "health: $status"
          [ "$status" = "healthy" ] || { docker inspect --format '{{json .State.Health}}' web; exit 1; }
