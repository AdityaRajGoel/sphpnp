# Kronos forecasts for the most liquid tracked symbols.
#
# RESEARCH OUTPUT. This job produces model-generated price RANGES, stored with a
# disclaimer and rendered as ranges - never as a price target. See
# supabase/migrations/20260912120000_stock_forecasts.sql for why the schema has
# no single-number column.
#
# Weekly, not daily. A model conditioned on ~400 daily bars does not produce a
# materially different distribution one session later, and the run costs several
# CPU-minutes plus a 200MB torch install. Saturday 02:00 UTC is clear of every
# other cron in this repo and of market hours entirely.
#
# Uses the SAME two secrets as every other sync workflow, deliberately:
#   SUPABASE_ANON_KEY   - reads the public market tables, passes the edge gateway
#   MARKET_SYNC_SECRET  - authorises the write to the ingest-forecasts function
#
# The service-role key is NOT here and must not be added. Every other workflow
# in this repo keeps it in Supabase, where the edge functions run, and a Python
# job holding it would be the weakest link in an otherwise consistent posture.
# The job posts its results to ingest-forecasts, which validates them and holds
# the key.
name: Kronos forecast

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      symbols:
        description: "How many top symbols by market cap to forecast"
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Kronos ships as source, not as a package on PyPI. Pinned to a commit
      # rather than a branch: this job's output is a published figure, and a
      # silent upstream change to the model code would change it without any
      # commit in this repo to explain the shift.
      - name: Fetch Kronos
        run: |
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git /tmp/kronos
          cd /tmp/kronos && git log -1 --format='Kronos at %H (%ci)'

      - name: Install dependencies
        run: |
          # CPU wheel only - the CUDA build is ~2.5GB and there is no GPU here.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r scripts/kronos/requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-weights-v1

      - name: Run the forecast
        env:
          SUPABASE_URL: https://zbkjbbujsdlpujotgltm.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
          KRONOS_SYMBOLS: ${{ inputs.symbols || '50' }}
          PYTHONPATH: /tmp/kronos
        run: python scripts/kronos/forecast.py
